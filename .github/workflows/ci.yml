name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    env:
      PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CanDoItAll.AgentFramework.Rag.slnx --configfile NuGet.config -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Validate repository structure
        shell: pwsh
        run: ./tools/validation/Test-Repository.ps1 -SkipBuild

      - name: Build, test, and validate packages
        shell: pwsh
        run: ./tools/deployment/nugets/Build-NuGets.ps1 -Configuration Release -NoRestore -Version $env:PACKAGE_VERSION

      - name: Upload package proof
        uses: actions/upload-artifact@v6
        with:
          name: rag-packages-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/packages/**/*.nupkg
            artifacts/packages/**/*.snupkg
          if-no-files-found: error
